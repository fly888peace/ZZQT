<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烛照 ZhuZhaoGUI · 代码知识图谱</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --panel2: #232730; --border: #33384299;
    --text: #e8eaed; --text-dim: #9aa0a6; --accent: #6cb2ff; --accent2: #3d7fd9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  header h1 .sub { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  #searchWrap { position: relative; flex: 0 0 300px; }
  #searchBox {
    width: 100%; padding: 6px 10px 6px 30px; border-radius: 6px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--text); outline: none;
  }
  #searchBox:focus { border-color: var(--accent); }
  #searchIcon { position: absolute; left: 9px; top: 7px; color: var(--text-dim); pointer-events: none; }
  #searchResults {
    position: absolute; top: 36px; left: 0; right: 0; z-index: 100;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 8px 24px #0009;
  }
  .sr-item { padding: 7px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .sr-item:hover { background: #2d323d; }
  .sr-item .sr-type { font-size: 11px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; flex-shrink: 0; }
  .sr-item .sr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stats { margin-left: auto; color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  #topBtns { display: flex; gap: 6px; }
  .tbtn {
    padding: 5px 10px; border-radius: 6px; background: var(--panel2);
    border: 1px solid var(--border); color: var(--text); cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .tbtn:hover { border-color: var(--accent); }
  .tbtn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }

  /* ---------- 主体 ---------- */
  #main { display: flex; flex: 1; min-height: 0; }

  /* 左侧面板 */
  #leftPanel {
    width: 240px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); overflow-y: auto; padding: 12px;
  }
  .sec-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .layer-row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; cursor: pointer; border-radius: 4px; }
  .layer-row:hover { background: #2d323d; }
  .layer-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .layer-count { color: var(--text-dim); font-size: 11px; }
  .type-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-dim); background: var(--panel2);
  }
  .chip.on { color: #fff; border-color: var(--accent); background: #2a3a52; }
  .hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }

  /* 导览 */
  #tourBox { margin-top: 2px; }
  #tourNav { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #tourNav button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  #tourNav button:hover { border-color: var(--accent); }
  #tourIdx { color: var(--text-dim); font-size: 12px; }
  #tourTitle { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
  #tourDesc { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  #tourLesson {
    margin-top: 8px; font-size: 12px; line-height: 1.6; padding: 8px;
    background: #2a2d1e; border: 1px solid #4a4d2e; border-radius: 6px; color: #d8d4b0;
  }

  /* 画布 */
  #canvasWrap { flex: 1; position: relative; min-width: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  #graph.dragging { cursor: grabbing; }
  #tooltip {
    position: absolute; pointer-events: none; display: none; z-index: 50;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; max-width: 280px; box-shadow: 0 4px 16px #0009;
  }
  #tooltip .tt-type { color: var(--text-dim); font-size: 11px; }
  #legendHint {
    position: absolute; left: 12px; bottom: 10px; color: var(--text-dim);
    font-size: 11px; pointer-events: none; text-shadow: 0 1px 2px #000;
  }

  /* 右侧详情面板 */
  #detail {
    width: 320px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--border); overflow-y: auto; padding: 16px;
  }
  #detailEmpty { color: var(--text-dim); text-align: center; margin-top: 40px; font-size: 13px; line-height: 1.8; }
  .d-type { font-size: 11px; padding: 1px 8px; border-radius: 4px; border: 1px solid; display: inline-block; margin-bottom: 8px; }
  .d-name { font-size: 17px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; word-break: break-all; }
  .d-path {
    font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--accent);
    background: var(--panel2); padding: 4px 8px; border-radius: 4px; margin-bottom: 12px;
    word-break: break-all;
  }
  .d-sec { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; }
  .d-summary { font-size: 13px; line-height: 1.7; color: #cfd3d8; }
  .d-notes {
    font-size: 12px; line-height: 1.7; padding: 8px 10px; border-radius: 6px;
    background: #2a2d1e; border: 1px solid #4a4d2e; color: #d8d4b0;
  }
  .d-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .d-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--border); color: var(--text-dim); }
  .d-complex { font-size: 12px; }
  .d-complex.simple { color: #6fce6f; } .d-complex.moderate { color: #e0b13a; } .d-complex.complex { color: #e06060; }
  .conn-item { padding: 5px 6px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .conn-item:hover { background: #2d323d; }
  .conn-dir { flex-shrink: 0; font-size: 13px; }
  .conn-dir.out { color: #6fce6f; } .conn-dir.in { color: #e08c3a; }
  .conn-type { font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; flex-shrink: 0; }
  .conn-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn-none { color: var(--text-dim); font-size: 12px; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3f4a; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>烛照 ZhuZhaoGUI<span class="sub">代码知识图谱 · Understand-Anything</span></h1>
    <div id="searchWrap">
      <span id="searchIcon">🔍</span>
      <input id="searchBox" type="text" placeholder="搜索节点：名称 / 摘要 / 标签…">
      <div id="searchResults"></div>
    </div>
    <div id="topBtns">
      <button class="tbtn active" id="btnLayered" title="按架构分层排布节点">分层布局</button>
      <button class="tbtn" id="btnRelayout" title="重新计算力导向布局">重新布局</button>
      <button class="tbtn" id="btnFit" title="缩放到刚好容纳全部节点">适应窗口</button>
    </div>
    <div id="stats"></div>
  </header>

  <div id="main">
    <aside id="leftPanel">
      <div class="sec-title">架构分层</div>
      <div id="layerList"></div>
      <hr class="hr">
      <div class="sec-title">节点类型</div>
      <div class="type-chips" id="typeChips"></div>
      <hr class="hr">
      <div class="sec-title">学习导览</div>
      <div id="tourBox">
        <div id="tourNav">
          <button id="tourPrev">‹</button>
          <span id="tourIdx">1 / 13</span>
          <button id="tourNext">›</button>
        </div>
        <div id="tourTitle"></div>
        <div id="tourDesc"></div>
        <div id="tourLesson" style="display:none"></div>
      </div>
    </aside>

    <div id="canvasWrap">
      <canvas id="graph"></canvas>
      <div id="tooltip"></div>
      <div id="legendHint">滚轮缩放 · 拖拽平移 · 点击节点查看详情 · 双击节点聚焦</div>
    </div>

    <aside id="detail">
      <div id="detailEmpty">点击画布中的节点<br>查看代码摘要与依赖关系</div>
      <div id="detailBody" style="display:none"></div>
    </aside>
  </div>
</div>

    { "id": "file:src/ZhuZhaoGUI/ZZConfigWidget/ZZConfigWidget.cpp", "type": "file", "name": "ZZConfigWidget.cpp", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ZZConfigWidget.cpp", "summary": "参数配置面板实现。lambda CreateOneParam 创建 4 个参数控件避免复制 4 遍；角度初值写死与 src/bin/images 示例图配套（换数据要同步改）；OnResetBtnClicked→Reset 全部+notify(UPDATE_SRCIMAGE)；OnRunOnceBtnClicked 只 notify(RUNONCE) 一嗓子，组参数起线程由 MainWindow 做 —— 观察者模式解耦的典型体现。", "tags": ["配置面板", "实现", "消息触发"], "complexity": "moderate" },
    { "id": "file:src/ZhuZhaoGUI/ZZConfigWidget/ZZOneParamWidget.h", "type": "file", "name": "ZZOneParamWidget.h", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ZZOneParamWidget.h", "summary": "「一组参数」控件声明：标题 + Slant/Tilt 双精度输入框 + 加载图片按钮。已加载的图存成员 m_qImage 等被取，不立即上传。", "tags": ["参数控件", "头文件"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZConfigWidget/ZZOneParamWidget.cpp", "type": "file", "name": "ZZOneParamWidget.cpp", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ZZOneParamWidget.cpp", "summary": "单参数控件实现。QFileDialog 选图（jpg/png/bmp），加载成功后【只 notify(UPDATE_SRCIMAGE) 不直接刷新别人】—— 本控件既不认识 MainWindow 也不认识缩略图列表，解耦彻底。constexpr 替换源工程拼写错的宏。", "tags": ["参数控件", "实现", "文件对话框"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZConfigWidget/ZZProcessThread.h", "type": "file", "name": "ZZProcessThread.h", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ZZProcessThread.h", "summary": "算法执行线程声明（全工程唯一 QThread）。QMutex 保护参数与结果两组数据；补上源工程缺失的 Q_OBJECT；删掉从未被读的 volatile bool（volatile 挡不住多线程竞争，真要可中止得用 std::atomic）。", "tags": ["多线程", "头文件"], "complexity": "moderate" },
    { "id": "file:src/ZhuZhaoGUI/ZZConfigWidget/ZZProcessThread.cpp", "type": "file", "name": "ZZProcessThread.cpp", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ZZProcessThread.cpp", "summary": "算法线程实现 —— 前后端的桥梁。run() 跑在子线程：① 锁内拷参数到本地（缩短持锁+防运行中被改）；② QImage 转灰度再 QImage2cvMat；③ 调 ZhuZhao::PhotometricStereo 算法；④ cvMat2QImage 转回写结果。函数返回后 QThread 自动 emit finished。不足 3 张图 QWARNING 跳过（光度立体最少 3 个方向）。", "tags": ["多线程", "实现", "前后端桥接"], "complexity": "moderate" },
    { "id": "file:src/ZhuZhaoGUI/ZZConfigWidget/ImageConvert.h", "type": "file", "name": "ImageConvert.h", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ImageConvert.h", "summary": "QImage ↔ cv::Mat 双向转换（Qt+OpenCV 混编必写）。cvMat2QImage 支持 8UC1/3/4，RGB888 默认 rgbSwapped（BGR→RGB）；QImage2cvMat 用 constBits+const_cast 包装指针，强烈建议 clone=true（cv::Mat 只包指针不复制数据，image 析构则悬空）。修：源工程非 inline 定义在头文件，第二个 cpp 包含即 LNK2005 重复定义。", "tags": ["工具", "图像转换", "Qt-OpenCV互操作"], "complexity": "moderate", "languageNotes": "inline 自由函数：每个包含它的翻译单元各有一份定义但链接器合并；ODR 安全。" },

    { "id": "file:src/ZhuZhaoGUI/ZZLogWidget/ZZLogMessage.h", "type": "file", "name": "ZZLogMessage.h", "filePath": "src/ZhuZhaoGUI/ZZLogWidget/ZZLogMessage.h", "summary": "全局日志器声明（懒汉式单例）。三大职责：接管 Qt 日志出口、写盘（log/yyyy-MM-dd/log.txt 超 1MB 轮转）、上屏（sigDebugHtmlData 信号）。QDEBUG/QWARNING/QCRITICAL 宏用 do{}while(0) 包裹 + 参数括号防优先级问题；故意不做 QFATAL（qFatal 是 printf 风格且会 abort）。", "tags": ["日志", "单例", "宏", "头文件"], "complexity": "moderate" },
    { "id": "file:src/ZhuZhaoGUI/ZZLogWidget/ZZLogMessage.cpp", "type": "file", "name": "ZZLogMessage.cpp", "filePath": "src/ZhuZhaoGUI/ZZLogWidget/ZZLogWidget/../ZZLogMessage.cpp", "summary": "日志器实现，本项目工程质量最高的一页。outputMessage 被 Qt 回调：static QMutex 串行写盘（漏 static 每线程一把锁等于没加）；QIODevice::Text 让 Qt 自动换行；size() 必须在 close() 前取（修源工程反例）；rollLogFile 编号归档+99 份满时滚动前移兜底；emit 放锁外防同线程直连死锁。Instance() 双检锁的 static QMutex 是修源工程局部 mutex 的关键。卸载时还原前任处理器而非无脑 nullptr。", "tags": ["日志", "单例", "实现", "锁"], "complexity": "complex", "languageNotes": "跨天缓存 m_cachedDate/m_cachedPath 避免每条日志 mkpath 碰磁盘；emit 放锁外是 AutoConnection 直连场景的防死锁关键。" },
    { "id": "file:src/ZhuZhaoGUI/ZZLogWidget/ZZLogWidget.h", "type": "file", "name": "ZZLogWidget.h", "filePath": "src/ZhuZhaoGUI/ZZLogWidget/ZZLogWidget.h", "summary": "日志显示面板声明：QTextBrowser + Clear/Helper 两按钮。只订阅不生产日志。", "tags": ["日志面板", "头文件"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZLogWidget/ZZLogWidget.cpp", "type": "file", "name": "ZZLogWidget.cpp", "filePath": "src/ZhuZhaoGUI/ZZLogWidget/ZZLogWidget.cpp", "summary": "日志面板实现。document()->setMaximumBlockCount(2000) 限制内存（修源工程只增不减）；OnLogMessageAppended 追加+滚到底，槽函数永远在主线程执行（跨线程日志自动 Queued 排队过来）；Helper 按钮开课程网页。", "tags": ["日志面板", "实现"], "complexity": "simple" },

    { "id": "file:src/ZhuZhaoGUI/ZZThumWidget/HThumbnailList.h", "type": "file", "name": "HThumbnailList.h", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/HThumbnailList.h", "summary": "横向缩略图列表声明（显示算法 3 张结果图）。每格 = QListWidgetItem + 自绘 LitImgItemWidget，靠 setItemWidget 绑定；SigSelectImageChanged(QImage&) 选中信号。与 VThumbnailList 只差三处：flow 方向/滚动条策略/item 尺寸算法。", "tags": ["缩略图", "头文件"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZThumWidget/HThumbnailList.cpp", "type": "file", "name": "HThumbnailList.cpp", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/HThumbnailList.cpp", "summary": "横向列表实现。LeftToRight flow + 横向滚动条按需/纵向关掉；item 宽高按列表高度推（尽量正方形）；nextImage/lastImage 循环切换绕回边界；修源工程两处越界（> length() 差一）。细窄滚动条 QSS 自绘。", "tags": ["缩略图", "实现"], "complexity": "moderate" },
    { "id": "file:src/ZhuZhaoGUI/ZZThumWidget/VThumbnailList.h", "type": "file", "name": "VThumbnailList.h", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/VThumbnailList.h", "summary": "纵向缩略图列表声明（显示 4 张输入图）。与 HThumbnailList 结构相同，接口一致，是课程刻意做的横向/纵向对照。", "tags": ["缩略图", "头文件"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZThumWidget/VThumbnailList.cpp", "type": "file", "name": "VThumbnailList.cpp", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/VThumbnailList.cpp", "summary": "纵向列表实现。TopToBottom flow + 竖向滚动条按需/横向关掉；item 宽高都按列表宽度推（正方形）。其余与 H 版一致 —— 两文件的差异清单是最佳学习材料。", "tags": ["缩略图", "实现"], "complexity": "moderate" },
    { "id": "file:src/ZhuZhaoGUI/ZZThumWidget/LitImgItemWidget.h", "type": "file", "name": "LitImgItemWidget.h", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/LitImgItemWidget.h", "summary": "缩略图「一格」声明。不用布局不用 QLabel，整格内容重写 paintEvent 自己画（好控制选中红框）。", "tags": ["缩略图", "自绘", "头文件"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZThumWidget/LitImgItemWidget.cpp", "type": "file", "name": "LitImgItemWidget.cpp", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/LitImgItemWidget.cpp", "summary": "缩略图格子实现。paintEvent：空图画 :/Resouce/icon/nullImg.png 占位（修源工程 //多斜杠+占位图覆盖空状态的隐患）；有焦点红框/无焦点黑框。setFocusPolicy(StrongFocus) 否则焦点被列表项拦走红框永不出现。setImage 后 update() 立刻重绘。", "tags": ["缩略图", "自绘", "实现"], "complexity": "simple" },

    { "id": "file:src/ZhuZhaoGUI/ZZViewWidget/CustomGraphicsView.h", "type": "file", "name": "CustomGraphicsView.h", "filePath": "src/ZhuZhaoGUI/ZZViewWidget/CustomGraphicsView.h", "summary": "视觉窗口核心声明：滚轮缩放（0.1~50 倍限幅）、双击自适应、棋盘格背景、左下角像素坐标/RGB 信息条。QGraphicsView 子类重写 4 个事件。", "tags": ["视觉窗口", "头文件"], "complexity": "moderate" },
    { "id": "file:src/ZhuZhaoGUI/ZZViewWidget/CustomGraphicsView.cpp", "type": "file", "name": "CustomGraphicsView.cpp", "filePath": "src/ZhuZhaoGUI/ZZViewWidget/CustomGraphicsView.cpp", "summary": "视觉窗口核心实现。棋盘格底纹自绘于 paintEvent（不走 setBackgroundBrush，否则底纹跟图缩放）；FullViewportUpdate 消拖动残影；SceneRect 给极大 + ScrollHandDrag 拖拽平移；fitFrame() 取两方向中更缩的那个保证都装下，回写 m_dZoomValue 防倍率漂移；SetImage 里 static QMutex 串行化换图（图可能来自算法线程）。", "tags": ["视觉窗口", "实现", "交互"], "complexity": "complex" },
    { "id": "file:src/ZhuZhaoGUI/ZZViewWidget/CustomImageItem.h", "type": "file", "name": "CustomImageItem.h", "filePath": "src/ZhuZhaoGUI/ZZViewWidget/CustomImageItem.h", "summary": "视觉窗口里的图像元素声明。多继承 QObject+QGraphicsPixmapItem（为用信号）；hoverMoveEvent 上报坐标与 RGB；w/h 公开成员记录当前图尺寸。", "tags": ["视觉窗口", "头文件"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZViewWidget/CustomImageItem.cpp", "type": "file", "name": "CustomImageItem.cpp", "filePath": "src/ZhuZhaoGUI/ZZViewWidget/CustomImageItem.cpp", "summary": "图像元素实现。setAcceptHoverEvents(true) 是 hover 回调的前提；hover 坐标即 item 局部像素下标，qBound 同时夹上下界（修源工程只夹下界，右下角外取越界像素）。", "tags": ["视觉窗口", "实现", "事件"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZViewWidget/CustomImageView.h", "type": "file", "name": "CustomImageView.h", "filePath": "src/ZhuZhaoGUI/ZZViewWidget/CustomImageView.h", "summary": "视觉窗口外壳声明：包一层 CustomGraphicsView，提供 OnSendImage 槽给缩略图列表连接。分层原因：列表只关心「选中了一张图」，不该知道 GraphicsView 存在。", "tags": ["视觉窗口", "外壳", "头文件"], "complexity": "simple" },
    { "id": "file:src/ZhuZhaoGUI/ZZViewWidget/CustomImageView.cpp", "type": "file", "name": "CustomImageView.cpp", "filePath": "src/ZhuZhaoGUI/ZZViewWidget/CustomImageView.cpp", "summary": "视觉窗口外壳实现。薄薄一层：摆位交给布局，换图转发给内部视图。OnSendImage 是「列表→窗口」的统一入口。", "tags": ["视觉窗口", "实现"], "complexity": "simple" },

    { "id": "class:src/ZhuZhaoGUI/MainWindow.h:MainWindow", "type": "class", "name": "MainWindow", "filePath": "src/ZhuZhaoGUI/MainWindow.h", "summary": "主窗口：搭全部布局、注册监听、集中响应消息。继承 QMainWindow + ZZListener。构造里 InitWidget() 失败 throw bad_alloc 兜底。", "tags": ["主窗口", "观察者模式"], "complexity": "moderate" },
    { "id": "class:src/ZhuZhaoGUI/ZZListener.h:ZZListener", "type": "class", "name": "ZZListener", "filePath": "src/ZhuZhaoGUI/ZZListener.h", "summary": "监听者抽象基类：纯虚 RespondMessage 使其不可实例化，虚析构保证基类指针安全 delete。", "tags": ["观察者模式", "抽象基类"], "complexity": "simple" },
    { "id": "class:src/ZhuZhaoGUI/ZZListener.h:ListenerManger", "type": "class", "name": "ListenerManger", "filePath": "src/ZhuZhaoGUI/ZZListener.h", "summary": "事件总管（饿汉式单例）：QMap<消息, QVector<监听者*>> 名册，notify 广播 / registerMessage 位拆包登记，禁拷贝禁赋值。", "tags": ["观察者模式", "单例", "事件总线"], "complexity": "moderate" },
    { "id": "class:src/ZhuZhaoGUI/ZZConfigWidget/ZZConfigWidget.h:ZZConfigWidget", "type": "class", "name": "ZZConfigWidget", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ZZConfigWidget.h", "summary": "参数配置面板：4 组参数控件 + Reset/RunOnce。GetPhotometricStereoParams() 是唯一数据出口。", "tags": ["配置面板"], "complexity": "moderate" },
    { "id": "class:src/ZhuZhaoGUI/ZZConfigWidget/ZZOneParamWidget.h:ZZOneParamWidget", "type": "class", "name": "ZZOneParamWidget", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ZZOneParamWidget.h", "summary": "单组参数控件：标题 + Slant/Tilt 输入框 + 加载按钮；图存 m_qImage 待取，加载后只广播消息不直接刷新别人。", "tags": ["参数控件"], "complexity": "simple" },
    { "id": "class:src/ZhuZhaoGUI/ZZConfigWidget/ZZProcessThread.h:ZZProcessThread", "type": "class", "name": "ZZProcessThread", "filePath": "src/ZhuZhaoGUI/ZZConfigWidget/ZZProcessThread.h", "summary": "算法线程（唯一 QThread）：QMutex 保护输入输出两组数据；run() 里 QImage↔cv::Mat 转换并调用算法 DLL；结束自动 emit finished。", "tags": ["多线程", "算法调用"], "complexity": "moderate" },
    { "id": "class:src/ZhuZhaoGUI/ZZLogWidget/ZZLogMessage.h:ZZLogMessage", "type": "class", "name": "ZZLogMessage", "filePath": "src/ZhuZhaoGUI/ZZLogWidget/ZZLogMessage.h", "summary": "全局日志器（懒汉式+双检锁单例，QObject）：接管 Qt 日志出口、写盘轮转、sigDebugHtmlData 上屏。", "tags": ["日志", "单例"], "complexity": "complex" },
    { "id": "class:src/ZhuZhaoGUI/ZZLogWidget/ZZLogWidget.h:ZZLogWidget", "type": "class", "name": "ZZLogWidget", "filePath": "src/ZhuZhaoGUI/ZZLogWidget/ZZLogWidget.h", "summary": "日志面板：QTextBrowser 显示 + Clear/Helper 按钮，订阅 sigDebugHtmlData。", "tags": ["日志面板"], "complexity": "simple" },
    { "id": "class:src/ZhuZhaoGUI/ZZThumWidget/HThumbnailList.h:HThumbnailList", "type": "class", "name": "HThumbnailList", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/HThumbnailList.h", "summary": "横向缩略图列表（结果图）：QListWidget+setItemWidget+自绘格子，发 SigSelectImageChanged。", "tags": ["缩略图"], "complexity": "moderate" },
    { "id": "class:src/ZhuZhaoGUI/ZZThumWidget/VThumbnailList.h:VThumbnailList", "type": "class", "name": "VThumbnailList", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/VThumbnailList.h", "summary": "纵向缩略图列表（输入图）：与 H 版只差 flow/滚动条/尺寸算法三处。", "tags": ["缩略图"], "complexity": "moderate" },
    { "id": "class:src/ZhuZhaoGUI/ZZThumWidget/LitImgItemWidget.h:LitImgItemWidget", "type": "class", "name": "LitImgItemWidget", "filePath": "src/ZhuZhaoGUI/ZZThumWidget/LitImgItemWidget.h", "summary": "缩略图格子：paintEvent 自绘图像+边框（焦点红/无焦点黑），空图占位图兜底。", "tags": ["缩略图", "自绘"], "complexity": "simple" },

    { "id": "class:src/ZhuZhaoGUI/ZZViewWidget/CustomImageItem.h:CustomImageItem", "type": "class", "name": "CustomImageItem", "filePath": "src/ZhuZhaoGUI/ZZViewWidget/CustomImageItem.h", "summary": "图像元素：QObject+QGraphicsPixmapItem 多继承，hover 上报坐标 RGB（RGBValue 信号）。", "tags": ["视觉窗口"], "complexity": "simple" },
    { "id": "class:src/ZhuZhaoGUI/ZZViewWidget/CustomImageView.h:CustomImageView", "type": "class", "name": "CustomImageView", "filePath": "src/ZhuZhaoGUI/ZZViewWidget/CustomImageView.h", "summary": "视觉窗口外壳：包 CustomGraphicsView，OnSendImage 槽作列表→窗口统一入口。", "tags": ["视觉窗口", "外壳"], "complexity": "simple" },

    { "id": "function:src/PhotometricStereo/PhotometricStereo.cpp:PhotometricStereo", "type": "function", "name": "ZhuZhao::PhotometricStereo", "filePath": "src/PhotometricStereo/PhotometricStereo.cpp", "summary": "DLL 导出的光度立体重建主函数。参数校验→建 4×3 光源矩阵（Slant/Tilt→单位向量，x/y 与教材相反为对齐数据）→cv::invert SVD 伪逆→逐像素解 ρN、归一化→梯度场→globalHeights 积分→normalize 三张 8 位结果图。返回 0 成功 / -1 参数非法。", "tags": ["算法", "导出函数", "OpenCV"], "complexity": "complex" },
    { "id": "function:src/PhotometricStereo/PhotometricStereo.cpp:globalHeights", "type": "function", "name": "globalHeights", "filePath": "src/PhotometricStereo/PhotometricStereo.cpp", "summary": "匿名命名空间内的频域积分：梯度场 dft 到频率域→逐频点做带正则项（lambda/mu 压高频噪声）的除法→逆变换回空域得高度场。直流分量留 0（平均高度未知，高度只有相对意义）。比空域逐点累加抗误差漂移。", "tags": ["算法", "傅里叶", "数学"], "complexity": "complex" },
    { "id": "function:src/PhotometricStereo/ExampleMain.cpp:main", "type": "function", "name": "main (ExampleMain)", "filePath": "src/PhotometricStereo/ExampleMain.cpp", "summary": "独立验证程序入口：读 4 张 test_*.png→调算法→imshow 源图/反照率/高度图，肉眼验收凹凸。", "tags": ["验证", "入口"], "complexity": "simple" },
    { "id": "function:src/ZhuZhaoGUI/main.cpp:main", "type": "function", "name": "main", "filePath": "src/ZhuZhaoGUI/main.cpp", "summary": "GUI 入口：fusion 样式→装日志处理器→装翻译器（顺序都不能反）→显示主窗口→exec() 事件循环。", "tags": ["入口", "初始化"], "complexity": "simple" },
    { "id": "function:src/ZhuZhaoGUI/MainWindow.cpp:RespondMessage", "type": "function", "name": "MainWindow::RespondMessage", "filePath": "src/ZhuZhaoGUI/MainWindow.cpp", "summary": "观察者的核心落点：位与判断三类消息。UPDATE_SRCIMAGE→取 4 组参数刷纵向列表；RUNONCE→组参数塞线程 start()。整个「点按钮→跑算法」链路的调度中心。", "tags": ["消息响应", "调度"], "complexity": "moderate" },

/* ============ 基础工具 ============ */

const TYPE_SHAPE  = { file:'circle', class:'diamond', function:'circle', config:'rect', document:'rect', concept:'circle' };

/* 节点 / 边 运行时结构 */
const nodes = GRAPH.nodes.map(n => {
  const layer = (GRAPH.layers.find(l => l.nodeIds.includes(n.id)) || null);
  return {
    ...n, x:0, y:0, vx:0, vy:0,
    layerId: layer ? layer.id : null,
    layerIdx: layer ? GRAPH.layers.indexOf(layer) : -1,
    color: layer ? LAYER_COLORS[layer.id] : DEFAULT_COLOR,
    r: TYPE_RADIUS[n.type] || 9,
    fixed: false
  };
});
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = GRAPH.edges.map(e => ({
  ...e, source: nodeById[e.source], target: nodeById[e.target]
})).filter(e => e.source && e.target);
const inEdges = new Map(), outEdges = new Map();
nodes.forEach(n => { inEdges.set(n.id, []); outEdges.set(n.id, []); });
edges.forEach(e => { outEdges.get(e.source.id).push(e); inEdges.get(e.target.id).push(e); });

/* ============ 状态 ============ */
const state = {
  visibleLayers: new Set(Object.keys(LAYER_COLORS)),
  visibleTypes: new Set(Object.keys(TYPE_LABEL)),
  selected: null, hovered: null,
  searchMatch: null,
  tourStep: -1,
  layered: true,
  alpha: 1
};

/* ============ 画布 ============ */
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
let W = 0, H = 0, dpr = window.devicePixelRatio || 1;
let view = { x: 0, y: 0, scale: 1 };

function resize() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);

function nodeVisible(n) {
  if (!state.visibleLayers.has(n.layerId)) return false;
  if (!state.visibleTypes.has(n.type)) return false;
  return true;
}

/* ============ 力导向布局 ============ */
function initPositions() {
  nodes.forEach(n => {
    const ang = Math.random() * Math.PI * 2;
    const band = n.layerIdx >= 0 ? n.layerIdx : GRAPH.layers.length;
    n.x = (Math.random() - 0.5) * 400 + Math.cos(ang) * 40;
    n.y = band * 170 - (GRAPH.layers.length * 170) / 2 + (Math.random() - 0.5) * 90;
    n.vx = 0; n.vy = 0; n.fixed = false;
  });
  state.alpha = 1;
}

const LAYER_GAP = 200;
function simulate() {
  const alpha = state.alpha;
  if (alpha < 0.002) return;
  const N = nodes.length;

  /* 斥力（节点间） */
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1e-4) { dx = (Math.random()-0.5); dy = (Math.random()-0.5); d2 = dx*dx+dy*dy; }
      if (d2 > 360000) continue;
      const d = Math.sqrt(d2);
      const rep = 26000 / d2 * alpha;
      const fx = dx / d * rep, fy = dy / d * rep;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  /* 弹簧（边） */
  edges.forEach(e => {
    const rest = e.type === 'contains' ? 42 : e.type === 'inherits' ? 70 : 110;
    const dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
    const d = Math.max(1, Math.sqrt(dx*dx + dy*dy));
    const f = (d - rest) * 0.012 * alpha;
    const fx = dx / d * f, fy = dy / d * f;
    e.source.vx += fx; e.source.vy += fy;
    e.target.vx -= fx; e.target.vy -= fy;
  });
  /* 引力（中心 + 分层带） */
  nodes.forEach(n => {
    if (state.layered && n.layerIdx >= 0) {
      const targetY = n.layerIdx * LAYER_GAP - (GRAPH.layers.length - 1) * LAYER_GAP / 2;
      n.vy += (targetY - n.y) * 0.02 * alpha;
      n.vx += (0 - n.x) * 0.0008 * alpha;
    } else {
      n.vx += (0 - n.x) * 0.002 * alpha;
      n.vy += (0 - n.y) * 0.002 * alpha;
    }
  });
  /* 积分 */
  nodes.forEach(n => {
    if (n.fixed) { n.vx = 0; n.vy = 0; return; }
    n.vx *= 0.86; n.vy *= 0.86;
    n.x += Math.max(-18, Math.min(18, n.vx));
    n.y += Math.max(-18, Math.min(18, n.vy));
  });
  state.alpha *= 0.995;
}

/* ============ 渲染 ============ */
function edgeAlpha(e) {
  const sel = state.selected, tour = state.tourStep >= 0 ? GRAPH.tour[state.tourStep] : null;
  const inTour = tour && (tour.nodeIds.includes(e.source.id) || tour.nodeIds.includes(e.target.id));
  if (inTour) return 0.55;
  if (sel && (e.source === sel || e.target === sel)) return 0.9;
  if (tour) return 0.05;
  if (!nodeVisible(e.source) || !nodeVisible(e.target)) return 0;
  if (sel) return 0.06;
  return 0.28;
}

function nodeAlpha(n) {
  const tour = state.tourStep >= 0 ? GRAPH.tour[state.tourStep] : null;
  if (tour) return tour.nodeIds.includes(n.id) ? 1 : 0.08;
  if (state.selected) {
    if (n === state.selected) return 1;
    if (inEdges.get(n.id).some(e => e.source === state.selected) ||
        outEdges.get(n.id).some(e => e.target === state.selected)) return 0.95;
    return 0.15;
  }
  if (state.searchMatch && state.searchMatch.has(n.id)) return 1;
  if (state.searchMatch) return 0.12;
  return nodeVisible(n) ? 0.95 : 0.04;
}

function drawNodeShape(n, r, stroke) {
  const shape = TYPE_SHAPE[n.type] || 'circle';
  ctx.beginPath();
  if (shape === 'circle') {
    if (n.type === 'concept') { ctx.setLineDash([4, 3]); }
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
  } else if (shape === 'diamond') {
    ctx.moveTo(n.x, n.y - r); ctx.lineTo(n.x + r, n.y);
    ctx.lineTo(n.x, n.y + r); ctx.lineTo(n.x - r, n.y); ctx.closePath();
  } else {
    ctx.rect(n.x - r * 0.9, n.y - r * 0.9, r * 1.8, r * 1.8);
  }
  ctx.fill();
  if (stroke) ctx.stroke();
  ctx.setLineDash([]);
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  /* 背景 */
  ctx.fillStyle = '#14161a'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(view.x, view.y); ctx.scale(view.scale, view.scale);

  /* 分层带背景 */
  if (state.layered) {
    GRAPH.layers.forEach((l, i) => {
      if (!state.visibleLayers.has(l.id)) return;
      const y = i * LAYER_GAP - (GRAPH.layers.length - 1) * LAYER_GAP / 2;
      ctx.fillStyle = LAYER_COLORS[l.id] + '0d';
      ctx.fillRect(-1600, y - LAYER_GAP/2 + 14, 3200, LAYER_GAP - 28);
      ctx.fillStyle = LAYER_COLORS[l.id] + '88';
      ctx.font = '600 15px system-ui, "Microsoft YaHei"';
      ctx.textAlign = 'left';
      ctx.fillText(l.name, -1580, y - LAYER_GAP/2 + 34);
    });
  }

  /* 边 */
  edges.forEach(e => {
    const a = edgeAlpha(e); if (a <= 0.005) return;
    const st = EDGE_STYLE[e.type] || EDGE_STYLE.related;
    const tour = state.tourStep >= 0 ? GRAPH.tour[state.tourStep] : null;
    const both = tour && tour.nodeIds.includes(e.source.id) && tour.nodeIds.includes(e.target.id);
    ctx.strokeStyle = both ? '#6cb2ff' : st.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = (state.selected && (e.source === state.selected || e.target === state.selected)) ? st.width + 0.6 : st.width;
    ctx.setLineDash(st.dash);
    ctx.beginPath();
    const sx = e.source.x, sy = e.source.y, tx = e.target.x, ty = e.target.y;
    ctx.moveTo(sx, sy); ctx.lineTo(tx, ty);
    ctx.stroke();
    /* 选中时画箭头 */
    if (state.selected && (e.source === state.selected || e.target === state.selected) && e.type !== 'related') {
      const dx = tx - sx, dy = ty - sy, d = Math.sqrt(dx*dx + dy*dy);
      if (d > 30) {
        const ux = dx / d, uy = dy / d;
        const ax = tx - ux * (e.target.r + 8), ay = ty - uy * (e.target.r + 8);
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - ux * 8 - uy * 4, ay - uy * 8 + ux * 4);
        ctx.lineTo(ax - ux * 8 + uy * 4, ay - uy * 8 - ux * 4);
        ctx.closePath(); ctx.fillStyle = st.color; ctx.fill();
      }
    }
  });
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  /* 节点 */
  nodes.forEach(n => {
    const a = nodeAlpha(n); if (a <= 0.01) return;
    ctx.globalAlpha = a;
    const isSel = n === state.selected;
    const isHov = n === state.hovered;
    const tour = state.tourStep >= 0 ? GRAPH.tour[state.tourStep] : null;
    const inTour = tour && tour.nodeIds.includes(n.id);
    const r = n.r + (isSel ? 3 : 0) + (inTour ? 2 : 0);

    if (isSel || inTour || (isHov && state.tourStep < 0)) {
      ctx.shadowColor = isSel ? '#ffffff' : (inTour ? '#6cb2ff' : n.color);
      ctx.shadowBlur = 16;
    }
    ctx.fillStyle = n.color;
    ctx.strokeStyle = isSel ? '#ffffff' : (n.type === 'concept' ? n.color : '#14161a');
    ctx.lineWidth = isSel ? 2.2 : 1.4;
    drawNodeShape(n, r, true);
    ctx.shadowBlur = 0;

    /* 标签 */
    const showLabel = view.scale > 0.55 || isSel || inTour || isHov;
    if (showLabel) {
      ctx.font = (isSel || inTour ? '600 ' : '') + '11px system-ui, "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      const label = n.name;
      const tw = ctx.measureText(label).width;
      ctx.fillRect(n.x - tw/2 - 3, n.y + r + 3, tw + 6, 14);
      ctx.fillStyle = isSel || inTour ? '#ffffff' : '#c9ced6';
      ctx.fillText(label, n.x, n.y + r + 14);
    }
  });
  ctx.globalAlpha = 1;
}

/* ============ 主循环 ============ */
function loop() { simulate(); render(); requestAnimationFrame(loop); }

/* ============ 视图变换 ============ */
function fitView(nodeSet) {
  const list = (nodeSet ? nodes.filter(n => nodeSet.has(n.id)) : nodes).filter(nodeVisible);
  if (!list.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  list.forEach(n => { x0 = Math.min(x0, n.x - 40); y0 = Math.min(y0, n.y - 50); x1 = Math.max(x1, n.x + 40); y1 = Math.max(y1, n.y + 50); });
  const pad = 30;
  const sx = (W - pad*2) / (x1 - x0), sy = (H - pad*2) / (y1 - y0);
  view.scale = Math.min(sx, sy, 1.6);
  view.x = (W - (x1 - x0) * view.scale) / 2 - x0 * view.scale;
  view.y = (H - (y1 - y0) * view.scale) / 2 - y0 * view.scale;
}

function screenToWorld(mx, my) { return { x: (mx - view.x) / view.scale, y: (my - view.y) / view.scale }; }

/* ============ 交互 ============ */
let dragNode = null, panning = false, lastMouse = { x: 0, y: 0 }, moved = false;

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const w = screenToWorld(mx, my);
  const hit = pickNode(w.x, w.y);
  if (hit && nodeVisible(hit)) {
    dragNode = hit; hit.fixed = true; moved = false;
  } else {
    panning = true; canvas.classList.add('dragging');
  }
  lastMouse = { x: mx, y: my };
});
window.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (dragNode) {
    const w = screenToWorld(mx, my);
    dragNode.x = w.x; dragNode.y = w.y;
    state.alpha = Math.max(state.alpha, 0.3);
    moved = true;
  } else if (panning) {
    view.x += mx - lastMouse.x; view.y += my - lastMouse.y;
    moved = true;
  } else {
    const w = screenToWorld(mx, my);
    state.hovered = pickNode(w.x, w.y);
    updateTooltip(e.clientX, e.clientY);
  }
  lastMouse = { x: mx, y: my };
});
window.addEventListener('mouseup', () => {
  if (dragNode && !moved) selectNode(dragNode);
  if (dragNode) { dragNode.fixed = false; dragNode = null; }
  panning = false; canvas.classList.remove('dragging');
});
canvas.addEventListener('dblclick', e => {
  const rect = canvas.getBoundingClientRect();
  const w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  const hit = pickNode(w.x, w.y);
  if (hit) { selectNode(hit); fitView(new Set([hit.id])); }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const old = view.scale;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  view.scale = Math.min(4, Math.max(0.12, view.scale * factor));
  view.x = mx - (mx - view.x) * (view.scale / old);
  view.y = my - (my - view.y) * (view.scale / old);
}, { passive: false });

function pickNode(wx, wy) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (!nodeVisible(n)) continue;
    const dx = wx - n.x, dy = wy - n.y;
    if (dx*dx + dy*dy <= (n.r + 4) * (n.r + 4)) return n;
  }
  return null;
}

const tooltip = document.getElementById('tooltip');
function updateTooltip(cx, cy) {
  const n = state.hovered;
  if (!n || state.tourStep >= 0) { tooltip.style.display = 'none'; return; }
  tooltip.innerHTML = `<div class="tt-type">${TYPE_LABEL[n.type] || n.type}${n.layerId ? ' · ' + (GRAPH.layers.find(l=>l.id===n.layerId)||{}).name : ''}</div><div>${n.name}</div>`;
  tooltip.style.display = 'block';
  const rect = wrap.getBoundingClientRect();
  let x = cx - rect.left + 14, y = cy - rect.top + 14;
  if (x + 290 > rect.width) x -= 300;
  if (y + 60 > rect.height) y -= 70;
  tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
}

/* ============ 详情面板 ============ */
const detailBody = document.getElementById('detailBody');
const detailEmpty = document.getElementById('detailEmpty');

function selectNode(n) {
  state.selected = n;
  state.tourStep = -1;
  updateTourUI();
  renderDetail(n);
}
function selectNodeById(id) { const n = nodeById[id]; if (n) selectNode(n); }

function renderDetail(n) {
  detailEmpty.style.display = 'none';
  detailBody.style.display = 'block';
  const layer = GRAPH.layers.find(l => l.id === n.layerId);
  let html = '';
  html += `<span class="d-type" style="color:${n.color};border-color:${n.color}">${TYPE_LABEL[n.type] || n.type}</span>`;
  if (layer) html += ` <span class="d-type" style="color:${LAYER_COLORS[layer.id]};border-color:${LAYER_COLORS[layer.id]}">${layer.name}</span>`;
  html += `<div class="d-name">${esc(n.name)}</div>`;
  if (n.filePath) html += `<div class="d-path">${esc(n.filePath)}</div>`;
  if (n.complexity) html += `<div class="d-sec">复杂度</div><div class="d-complex ${n.complexity}">${
    n.complexity === 'simple' ? '● 简单' : n.complexity === 'moderate' ? '●● 中等' : '●●● 复杂'}</div>`;
  html += `<div class="d-sec">摘要</div><div class="d-summary">${esc(n.summary || '')}</div>`;
  if (n.languageNotes) html += `<div class="d-sec">语言点</div><div class="d-notes">💡 ${esc(n.languageNotes)}</div>`;
  if (n.tags && n.tags.length) {
    html += `<div class="d-sec">标签</div><div class="d-tags">` + n.tags.map(t => `<span class="d-tag">${esc(t)}</span>`).join('') + `</div>`;
  }
  /* 出边（下游依赖） */
  const outs = outEdges.get(n.id) || [];
  html += `<div class="d-sec">下游依赖（${outs.length}）</div>`;
  html += outs.length ? outs.map(e =>
    `<div class="conn-item" data-id="${e.target.id}"><span class="conn-dir out">→</span><span class="conn-type">${e.type}</span><span class="conn-name">${esc(e.target.name)}</span></div>`
  ).join('') : `<div class="conn-none">无</div>`;
  /* 入边（上游依赖） */
  const ins = inEdges.get(n.id) || [];
  html += `<div class="d-sec">上游引用（${ins.length}）</div>`;
  html += ins.length ? ins.map(e =>
    `<div class="conn-item" data-id="${e.source.id}"><span class="conn-dir in">←</span><span class="conn-type">${e.type}</span><span class="conn-name">${esc(e.source.name)}</span></div>`
  ).join('') : `<div class="conn-none">无</div>`;

  detailBody.innerHTML = html;
  detailBody.querySelectorAll('.conn-item').forEach(el => {
    el.addEventListener('click', () => selectNodeById(el.dataset.id));
  });
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ 图层列表 ============ */
const layerList = document.getElementById('layerList');
GRAPH.layers.forEach(l => {
  const count = l.nodeIds.length;
  const row = document.createElement('div');
  row.className = 'layer-row';
  row.innerHTML = `<span class="layer-dot" style="background:${LAYER_COLORS[l.id]}"></span>
    <span class="layer-name" title="${esc(l.name)}">${esc(l.name)}</span>
    <span class="layer-count">${count}</span>`;
  row.addEventListener('click', () => {
    if (state.visibleLayers.has(l.id)) state.visibleLayers.delete(l.id);
    else state.visibleLayers.add(l.id);
    row.style.opacity = state.visibleLayers.has(l.id) ? 1 : 0.35;
  });
  layerList.appendChild(row);
});

/* ============ 类型过滤 ============ */
const typeChips = document.getElementById('typeChips');
Object.entries(TYPE_LABEL).forEach(([t, label]) => {
  const chip = document.createElement('span');
  chip.className = 'chip on';
  chip.textContent = label;
  chip.addEventListener('click', () => {
    if (state.visibleTypes.has(t)) state.visibleTypes.delete(t);
    else state.visibleTypes.add(t);
    chip.classList.toggle('on', state.visibleTypes.has(t));
  });
  typeChips.appendChild(chip);
});

/* ============ 搜索 ============ */
const searchBox = document.getElementById('searchBox');
const searchResults = document.getElementById('searchResults');
searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim().toLowerCase();
  if (!q) {
    searchResults.style.display = 'none'; state.searchMatch = null;
    return;
  }
  const matches = nodes.filter(n =>
    n.name.toLowerCase().includes(q) ||
    (n.summary || '').toLowerCase().includes(q) ||
    (n.tags || []).some(t => t.toLowerCase().includes(q)) ||
    (n.filePath || '').toLowerCase().includes(q)
  ).slice(0, 20);
  state.searchMatch = new Set(matches.map(n => n.id));
  if (matches.length) {
    searchResults.innerHTML = matches.map(n =>
      `<div class="sr-item" data-id="${n.id}"><span class="sr-type">${TYPE_LABEL[n.type] || n.type}</span><span class="sr-name">${esc(n.name)}</span></div>`
    ).join('');
    searchResults.style.display = 'block';
    searchResults.querySelectorAll('.sr-item').forEach(el => {
      el.addEventListener('click', () => {
        selectNodeById(el.dataset.id);
        fitView(new Set([el.dataset.id]));
        searchResults.style.display = 'none';
      });
    });
  } else {
    searchResults.innerHTML = '<div class="sr-item" style="color:#9aa0a6">无匹配节点</div>';
    searchResults.style.display = 'block';
  }
});
searchBox.addEventListener('keydown', e => { if (e.key === 'Escape') { searchBox.value = ''; searchBox.dispatchEvent(new Event('input')); } });
document.addEventListener('click', e => { if (!e.target.closest('#searchWrap')) searchResults.style.display = 'none'; });

/* ============ 导览 ============ */
const tourTitle = document.getElementById('tourTitle');
const tourDesc = document.getElementById('tourDesc');
const tourLesson = document.getElementById('tourLesson');
const tourIdx = document.getElementById('tourIdx');

function updateTourUI() {
  const t = state.tourStep >= 0 ? GRAPH.tour[state.tourStep] : null;
  tourIdx.textContent = `${Math.max(state.tourStep + 1, 1)} / ${GRAPH.tour.length}`;
  if (!t) {
    tourTitle.textContent = '点击 › 开始导览';
    tourDesc.textContent = '按依赖顺序带你走读整个代码库：从规格书到构建体系共 ' + GRAPH.tour.length + ' 站。导览模式下仅高亮当前站点的节点。';
    tourLesson.style.display = 'none';
    return;
  }
  tourTitle.textContent = `第 ${t.order} 站 · ${t.title}`;
  tourDesc.textContent = t.description;
  if (t.languageLesson) {
    tourLesson.style.display = 'block';
    tourLesson.innerHTML = '💡 ' + esc(t.languageLesson);
  } else tourLesson.style.display = 'none';
}
document.getElementById('tourPrev').addEventListener('click', () => { state.tourStep = Math.max(0, state.tourStep - 1); state.selected = null; updateTourUI(); fitTour(); });
document.getElementById('tourNext').addEventListener('click', () => {
  state.tourStep = state.tourStep < 0 ? 0 : Math.min(GRAPH.tour.length - 1, state.tourStep + 1);
  state.selected = null; updateTourUI(); fitTour();
});
function fitTour() {
  const t = GRAPH.tour[state.tourStep];
  if (t) fitView(new Set(t.nodeIds));
}

/* ============ 顶栏按钮 ============ */
document.getElementById('btnRelayout').addEventListener('click', () => { initPositions(); state.alpha = 1; });
document.getElementById('btnFit').addEventListener('click', () => fitView(null));
document.getElementById('btnLayered').addEventListener('click', function () {
  state.layered = !state.layered;
  this.classList.toggle('active', state.layered);
  state.alpha = 1;
});

/* ============ 统计 ============ */
document.getElementById('stats').textContent =
  `${nodes.length} 节点 · ${edges.length} 边 · ${GRAPH.layers.length} 层 · 导览 ${GRAPH.tour.length} 站`;

/* ============ 启动 ============ */
resize();
initPositions();
updateTourUI();
/* 预热模拟，让首帧就有合理布局 */
for (let i = 0; i < 260; i++) simulate();
state.alpha = 0.5;
fitView(null);
loop();
</script>
</body>
</html>
